# tmux's prefix+L and prefix+; for herdr, which has no last_workspace action and whose built-in
# last_pane is a single global slot rather than per-workspace. herdr spawns the record hooks itself
# on every focus event, so there is no daemon.
id = "garrett361.last-focus"
name = "Last focus"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Toggle back to the previous workspace, or the previous pane within a workspace"
platforms = ["linux", "macos"]

[[events]]
on = "workspace.focused"
command = ["sh", "-c", '"$HERDR_PLUGIN_ROOT/last-focus" record-workspace']

[[events]]
on = "pane.focused"
command = ["sh", "-c", '"$HERDR_PLUGIN_ROOT/last-focus" record-pane']

[[actions]]
id = "workspace"
title = "Switch to last workspace"
contexts = ["workspace"]
command = ["sh", "-c", '"$HERDR_PLUGIN_ROOT/last-focus" switch-workspace']

[[actions]]
id = "pane"
title = "Switch to last pane in this workspace"
contexts = ["workspace"]
command = ["sh", "-c", '"$HERDR_PLUGIN_ROOT/last-focus" switch-pane']
