# tmux's prefix+L and prefix+l for herdr, which has no last_workspace or last_tab action. herdr
# spawns the record hooks itself on every focus event, so there is no daemon.
id = "garrett361.last-focus"
name = "Last focus"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Toggle back to the previous workspace, or the previous tab within a workspace"
platforms = ["linux", "macos"]

[[events]]
on = "workspace.focused"
command = ["sh", "-c", '"$HERDR_PLUGIN_ROOT/last-focus" record-workspace']

[[events]]
on = "tab.focused"
command = ["sh", "-c", '"$HERDR_PLUGIN_ROOT/last-focus" record-tab']

[[actions]]
id = "workspace"
title = "Switch to last workspace"
contexts = ["workspace"]
command = ["sh", "-c", '"$HERDR_PLUGIN_ROOT/last-focus" switch-workspace']

[[actions]]
id = "tab"
title = "Switch to last tab in this workspace"
contexts = ["workspace"]
command = ["sh", "-c", '"$HERDR_PLUGIN_ROOT/last-focus" switch-tab']
