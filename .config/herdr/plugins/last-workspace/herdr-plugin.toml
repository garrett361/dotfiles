# tmux's `switch-client -l` for herdr, which has no last_workspace action and persists no focus
# history. herdr spawns the record hook itself on every workspace.focused event, so there is no
# daemon: herdr is the daemon.
id = "garrett361.last-workspace"
name = "Last workspace"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Toggle back to the previously focused workspace"
platforms = ["linux", "macos"]

[[events]]
on = "workspace.focused"
command = ["sh", "-c", '"$HERDR_PLUGIN_ROOT/last-workspace" record']

[[actions]]
id = "switch"
title = "Switch to last workspace"
contexts = ["workspace"]
command = ["sh", "-c", '"$HERDR_PLUGIN_ROOT/last-workspace" switch']
