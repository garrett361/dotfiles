# Only values that diverge from `herdr --default-config` belong here.
# Validate with `herdr config check`; apply to a running server with `herdr server reload-config`.

# herdr wrote this at first run. install.sh clears the destination before linking, so it has to
# live here or a fresh link resets herdr's onboarding state.
onboarding = false

[theme]
# Follow ghostty's palette; the default catppuccin ignores the host terminal and reads duller.
name = "terminal"

[theme.custom]
# `terminal` puts the focused tab's ANSI 8 label on an ANSI 4 fill, which is unreadable here.
accent = "cyan"

[keys]

# tmux's detach key. herdr's default is prefix+q.
detach = "prefix+d"

# tmux's split keys. herdr's split_vertical is a right split and split_horizontal a down split,
# which is the opposite of tmux's -h/-v naming for those same two layouts.
split_vertical = "prefix+%"
split_horizontal = 'prefix+"'

# tmux's prefix+x kill scale, one level up: x closes the pane (herdr's default, unchanged) and X
# closes the whole workspace. That evicts close_tab, which is left unbound on purpose, since
# closing panes is enough; `herdr tab close <tab_id>` remains if a tab ever needs to go.
close_workspace = "prefix+shift+x"
close_tab = ""

# tmux reloads on prefix+r (tmux.common.conf); resize mode takes the key reload vacates.
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# tmux's stock select-pane bindings, which frees h/j/k/l.
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"

# j/k follow the agent panel's order. h stays unbound; prefix+tab still cycles panes.
next_agent = "prefix+j"
previous_agent = "prefix+k"

# prefix+g goes to the sessionizer below, matching tmux. The session navigator takes the shifted
# key, being the same idea as prefix+f widened to the whole session tree.
goto = "prefix+shift+f"

# tmux-sessionizer for herdr: fuzzy-pick a project directory, then focus the workspace rooted there
# or create it. Absolute path on purpose, since custom commands run through /bin/sh with no login
# profile and ~/.local/scripts is only on PATH for interactive shells.
# Every picker below is sized 100%/100%: a popup percentage is a share of the terminal area and
# includes the popup border, so this is the full-screen end of that range.
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "$HOME/.local/scripts/herdr-sessionizer"
description = "sessionizer: focus or create a workspace by directory"
width = "100%"
height = "100%"

# tmux-list-sessionizer for herdr, on the same key tmux uses. herdr's own workspace_picker
# (prefix+w, left at its default) is a sidebar surface navigated with the arrow keys rather than a
# fuzzy picker, so this keeps the tmux workflow: type to match, Enter to focus, Ctrl-X to close.
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "$HOME/.local/scripts/herdr-list-sessionizer"
description = "sessionizer: focus or close an open workspace"
width = "100%"
height = "100%"

# Fuzzy-pick among agents rather than workspaces, with a live preview of each one's terminal
# output. herdr's own agent panel is prefix+j/k stepping through a sidebar list: no search, no
# preview, and no way to see only the agents that are blocked or done. Tab cycles the status
# filter, Enter focuses.
[[keys.command]]
key = "prefix+a"
type = "popup"
command = "$HOME/.local/scripts/herdr-agent-picker"
description = "agents: focus an agent, filtered by status"
width = "100%"
height = "100%"

# tmux's prefix+L and prefix+l. herdr has neither a last_workspace nor a last_tab action.
[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "garrett361.last-focus.workspace"
description = "switch to the last workspace"

[[keys.command]]
key = "prefix+l"
type = "plugin_action"
command = "garrett361.last-focus.tab"
description = "switch to the last tab in this workspace"

[ui]
# Distinct static glyphs per agent state instead of color-only dots.
status_indicators = "symbols"

prompt_new_tab_name = false

# tmux's status line sits at the bottom. Prefix, navigate, copy and resize mode bars replace this
# row while they are active, so the tab numbers are hidden while the prefix is held.
tab_bar_position = "bottom"

# What workspace this is, for when prefix+b hides the sidebar that otherwise says so.
tab_bar_right = [
  { type = "command", command = 'toplevel=$(git rev-parse --show-toplevel 2>/dev/null); printf "%s\n" "${toplevel##*/}"' },
]
