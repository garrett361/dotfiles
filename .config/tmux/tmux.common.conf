set -g base-index 1

# vim and copying
set-window-option -g mode-keys vi
# Auto-renumber windows
set-option -g renumber-windows on
# Go to rightmost window after killing a window with x
bind-key x killp \; run-shell 'tmux select-window -t $(tmux display-message -p "#{session_windows}")'
# Kill all panes to the right of and including the current pane. Kill in reverse order due to
# renumber-windows on
bind-key X run-shell '\
    curr_window_num=$(tmux display-message -p "#I"); \
    max_window_num=$(tmux list-windows | cut -d: -f1 | sort -nr | head -n1); \
    for i in $(seq $max_window_num -1 $curr_window_num ); do \
        tmux kill-window -t $i; \
    done;\
    tmux select-window -t $((curr_window_num - 1))
    '
# Make copy-mode selections available to vi(m) paste
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection

# Replace find with Primeagen's tmux-sessionizer.  Starts a new window, then runs the
# below script which instantiates (or attaches) to a session starting from a directory
# found through a (fzf).
set-option -ga update-environment ' DOTFILES GITHUB'
bind-key -r g run-shell "tmux neww $SHELL -c tmux-sessionizer"
bind-key -r f run-shell "tmux neww $SHELL -c tmux-list-sessionizer"

# prefix+a: fuzzy-pick a running coding agent, see what it is doing, and jump to its pane. Not -r,
# unlike the two pickers above: opening it is not a repeatable motion. The absolute path is needed
# for the same reason prefix+c uses one, since PATH here is the tmux server's and not an
# interactive shell's. The two variables are what the new window cannot work out for itself: its
# own $TMUX_PANE is the picker's, and resolving the client from inside that pane is per session,
# which would pick the wrong terminal when two clients share one.
bind-key a run-shell "tmux neww -e TMUX_AGENT_PICKER_FROM=#{pane_id} -e TMUX_AGENT_PICKER_CLIENT=#{client_tty} $SHELL -c ~/.local/scripts/tmux-agent-picker"

# On hosts where the picker is installed, prefix+c asks where the new window's shell should run:
# this machine (the highlighted default) or a node of a running slurm allocation. test -x keeps
# tmux's stock binding everywhere else, and no -c means the working directory is unchanged.
if-shell 'test -x ~/.local/scripts/tmux-slurm-shell' \
    "bind-key c new-window '~/.local/scripts/tmux-slurm-shell'"

# Colors?
set -ga terminal-overrides ",xterm-256color:Tc"
# Ghostty sends TERM=xterm-ghostty, which the override above does not match, so
# declare truecolor for it directly. Without this tmux downsamples 24-bit colors
# to the 256 color palette and everything looks washed out.
set -as terminal-features ",xterm-ghostty:RGB"
set-option -g default-terminal "screen-256color"

# I dunno: https://unix.stackexchange.com/a/608179
set -s escape-time 0
bind r run-shell "echo 'reloading tmux'" \; source-file ~/.config/tmux/tmux.conf


# Style
set -g status-left-length 120

# Agent state per state, as "<this session>:<all sessions>". The rest of the line is tmux's stock
# status-right, carried over because setting this option replaces that default outright, and 80
# because the stock content alone already fills the default 40.
set -g status-right-length 80
if-shell 'test -x ~/.local/scripts/tmux-agent-counts' \
    "set -g status-right '#(~/.local/scripts/tmux-agent-counts #{q:session_name})  #{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=21:pane_title}\" %H:%M %d-%b-%y'"

# https://github.com/tmux/tmux/wiki/Clipboard
set-option -g set-clipboard on

# Longer history
set-option -g history-limit 250000


# # Sending common commands to all panes
# bind-key s setw synchronize-panes
# # Visual indicator when sync is on
# set -g status-right '#{?pane_synchronized,#[bg=red]SYNC#[default] ,}#[fg=cyan]%H:%M#[default]'

# Send command to all panes with prefix + S
bind-key S command-prompt -p "Command to all panes:" \
  "run-shell 'tmux list-panes -F \"##{pane_index}\" | xargs -I {} tmux send-keys -t {} \"%%\" Enter'"

# Send command to all panes in all windows with prefix + W
bind-key W command-prompt -p "Command to all session panes:" \
  "run-shell 'tmux list-panes -s -F \"##{window_index}.##{pane_index}\" | xargs -I {} tmux send-keys -t {} \"%%\" Enter'"

# Insert window at position, shifting others up
bind-key i command-prompt -p "Insert at:" "\
  run-shell '\
    target=%1; \
    curr=$(tmux display-message -p \"#I\"); \
    max=$(tmux list-windows -F \"#I\" | sort -rn | head -1); \
    tmux move-window -s :\$curr -t :\$((max+1)); \
    for ((i=max; i>=target; i--)); do \
      tmux move-window -s :\$i -t :\$((i+1)) 2>/dev/null; \
    done; \
    tmux move-window -s :\$((max+1)) -t :\$target'"
