set -g base-index 1

# vim and copying
set-window-option -g mode-keys vi
# Auto-renumber windows
set-option -g renumber-windows on
# Go to rightmost window after killing a window with x
bind-key x kill-window \; run-shell 'tmux select-window -t $(tmux display-message -p "#{session_windows}")'
# Make copy-mode selections available to vi(m) paste
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe 'xclip -in -selection clipboard'

# Replace find with Primeagen's tmux-sessionizer.  Starts a new window, then runs the
# below script which instantiates (or attaches) to a session starting from a directory
# found through a (fzf).
set-option -ga update-environment ' DOTFILES GITHUB'
bind-key -r g run-shell "tmux neww tmux-sessionizer"
bind-key -r f run-shell "tmux neww tmux-list-sessionizer"

# Colors?
set -ga terminal-overrides ",xterm-256color:Tc"
set-option -g default-terminal "screen-256color"

# I dunno: https://unix.stackexchange.com/a/608179
set -s escape-time 0
bind r run-shell "echo 'reloading tmux'" \; source-file ~/.config/tmux/tmux.conf


# Style
set -g status-left-length 40

# https://github.com/tmux/tmux/wiki/Clipboard
set-option -g set-clipboard on

# Longer history
set-option -g history-limit 50000

