set -g base-index 1

# vim and copying
set-window-option -g mode-keys vi
# Auto-renumber windows
set-option -g renumber-windows on
# Go to rightmost window after killing a window with x
bind-key x killp \; run-shell 'tmux select-window -t $(tmux display-message -p "#{session_windows}")'
# Kill all panes to the right of and including the current pane. Kill in reverse order due to
# renumber-windows on
bind-key X run-shell '\
    curr_window_num=$(tmux display-message -p "#I"); \
    max_window_num=$(tmux list-windows | cut -d: -f1 | sort -nr | head -n1); \
    for i in $(seq $max_window_num -1 $curr_window_num ); do \
        tmux kill-window -t $i; \
    done;\
    tmux select-window -t $((curr_window_num - 1))
    '
# Make copy-mode selections available to vi(m) paste
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe 'xclip -in -selection clipboard'

# Replace find with Primeagen's tmux-sessionizer.  Starts a new window, then runs the
# below script which instantiates (or attaches) to a session starting from a directory
# found through a (fzf).
set-option -ga update-environment ' DOTFILES GITHUB'
bind-key -r g run-shell "tmux neww $SHELL -c tmux-sessionizer"
bind-key -r f run-shell "tmux neww $SHELL -c tmux-list-sessionizer"

# Colors?
set -ga terminal-overrides ",xterm-256color:Tc"
set-option -g default-terminal "screen-256color"

# I dunno: https://unix.stackexchange.com/a/608179
set -s escape-time 0
bind r run-shell "echo 'reloading tmux'" \; source-file ~/.config/tmux/tmux.conf


# Style
set -g status-left-length 120

# https://github.com/tmux/tmux/wiki/Clipboard
set-option -g set-clipboard on

# Longer history
set-option -g history-limit 250000


# # Sending common commands to all panes
# bind-key s setw synchronize-panes
# # Visual indicator when sync is on
# set -g status-right '#{?pane_synchronized,#[bg=red]SYNC#[default] ,}#[fg=cyan]%H:%M#[default]'

# Send command to all panes with prefix + S
bind-key S command-prompt -p "Command to all panes:" \
  "run-shell 'tmux list-panes -F \"##{pane_index}\" | xargs -I {} tmux send-keys -t {} \"%%\" Enter'"

# Send command to all panes in all windows with prefix + W
bind-key W command-prompt -p "Command to all session panes:" \
  "run-shell 'tmux list-panes -s -F \"##{window_index}.##{pane_index}\" | xargs -I {} tmux send-keys -t {} \"%%\" Enter'"

# Insert window at position, shifting others up
bind-key i command-prompt -p "Insert at:" "\
  run-shell '\
    target=%1; \
    curr=$(tmux display-message -p \"#I\"); \
    max=$(tmux list-windows -F \"#I\" | sort -rn | head -1); \
    tmux move-window -s :\$curr -t :\$((max+1)); \
    for ((i=max; i>=target; i--)); do \
      tmux move-window -s :\$i -t :\$((i+1)) 2>/dev/null; \
    done; \
    tmux move-window -s :\$((max+1)) -t :\$target'"
